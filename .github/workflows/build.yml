name: build
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[web,dev]"
      - run: python -m pytest -q
      - run: python -m controlled_chaos.utilities.audit .
        env: { PYTHONPATH: src }
  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev mpv ninja-build
      - run: pip install "flet==1.0.5" "flet-cli==1.0.5" "flet-desktop==1.0.5"
      - run: flet build linux --yes
      - uses: actions/upload-artifact@v4
        with: { name: controlled-chaos-linux, path: build/linux }
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install "flet==1.0.5" "flet-cli==1.0.5" "flet-desktop==1.0.5"
      - run: flet build windows --yes
      - uses: actions/upload-artifact@v4
        with: { name: controlled-chaos-windows, path: build/windows }
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install "flet==1.0.5" "flet-cli==1.0.5" "flet-desktop==1.0.5"
      # Signing is optional. Add repo secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS (your own upload key). Without them the build is unsigned/debug-signed
      # by Flet and is NOT suitable for Google Play.
      - name: Prepare signing flags
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "SIGN=--android-signing-key-store $RUNNER_TEMP/upload.jks --android-signing-key-store-password ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} --android-signing-key-password ${{ secrets.ANDROID_KEY_PASSWORD }} --android-signing-key-alias ${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"; fi
      - run: flet build apk --yes $SIGN
      - run: flet build aab --yes $SIGN
      - uses: actions/upload-artifact@v4
        with: { name: controlled-chaos-android, path: "build/apk\nbuild/aab" }
